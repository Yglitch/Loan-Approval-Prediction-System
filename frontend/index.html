<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoanIQ — Instant Loan Decisioning</title>

  <!-- Google Fonts: Sora for display/headings, Inter for body copy, IBM Plex Mono for financial figures -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">
    <main class="card" role="main">

      <!-- ============ HEADER ============ -->
      <header class="card-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L3 6.5V11c0 5.25 3.6 9.9 9 11 5.4-1.1 9-5.75 9-11V6.5L12 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M8.5 12.2l2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="brand-name">LoanIQ</span>
        </div>
        <p class="tagline">AI-powered loan decisioning, in seconds</p>
      </header>

      <!-- ============ FORM VIEW ============ -->
      <section class="card-body" id="formView">
        <form id="loanForm" novalidate autocomplete="off">

          <div class="field-grid">

            <!-- Number of Dependents -->
            <div class="field">
              <label for="no_of_dependents">Number of Dependents</label>
              <input
                type="number"
                id="no_of_dependents"
                name="no_of_dependents"
                placeholder="e.g. 2"
                min="0"
                step="1"
                aria-describedby="err_no_of_dependents"
              />
              <span class="error-msg" id="err_no_of_dependents" role="alert"></span>
            </div>

            <!-- Education -->
            <div class="field">
              <label for="education">Education</label>
              <select id="education" name="education" aria-describedby="err_education">
                <option value="" disabled selected>Select education level</option>
                <option value="Graduate">Graduate</option>
                <option value="Not Graduate">Not Graduate</option>
              </select>
              <span class="error-msg" id="err_education" role="alert"></span>
            </div>

            <!-- Self Employed -->
            <div class="field">
              <label for="self_employed">Self Employed</label>
              <select id="self_employed" name="self_employed" aria-describedby="err_self_employed">
                <option value="" disabled selected>Select an option</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
              <span class="error-msg" id="err_self_employed" role="alert"></span>
            </div>

            <!-- Annual Income -->
            <div class="field">
              <label for="income_annum">Annual Income (₹)</label>
              <input
                type="number"
                id="income_annum"
                name="income_annum"
                placeholder="e.g. 550000"
                min="0"
                step="1000"
                aria-describedby="err_income_annum"
              />
              <span class="error-msg" id="err_income_annum" role="alert"></span>
            </div>

            <!-- Loan Amount -->
            <div class="field">
              <label for="loan_amount">Loan Amount (₹)</label>
              <input
                type="number"
                id="loan_amount"
                name="loan_amount"
                placeholder="e.g. 2000000"
                min="0"
                step="1000"
                aria-describedby="err_loan_amount"
              />
              <span class="error-msg" id="err_loan_amount" role="alert"></span>
            </div>

            <!-- Loan Term -->
            <div class="field">
              <label for="loan_term">Loan Term (months)</label>
              <input
                type="number"
                id="loan_term"
                name="loan_term"
                placeholder="e.g. 12"
                min="1"
                step="1"
                aria-describedby="err_loan_term"
              />
              <span class="error-msg" id="err_loan_term" role="alert"></span>
            </div>

          </div>

          <!-- ============ CIBIL SCORE — SIGNATURE PANEL ============ -->
          <div class="cibil-panel">
            <div class="cibil-info">
              <label for="cibil_score">CIBIL Score</label>
              <input
                type="number"
                id="cibil_score"
                name="cibil_score"
                placeholder="300 – 900"
                min="300"
                max="900"
                step="1"
                aria-describedby="err_cibil_score"
              />
              <span class="error-msg" id="err_cibil_score" role="alert"></span>
              <p class="cibil-hint">Valid range: 300 (poor) to 900 (excellent)</p>
            </div>

            <div class="cibil-gauge" aria-hidden="true">
              <svg viewBox="0 0 200 120" width="180" height="108">
                <path class="gauge-track" d="M20 110 A80 80 0 0 1 180 110" />
                <path class="gauge-fill" id="gaugeFill" d="M20 110 A80 80 0 0 1 180 110" />
              </svg>
              <div class="gauge-readout">
                <span class="gauge-value" id="gaugeValue">—</span>
                <span class="gauge-label" id="gaugeLabel">enter score</span>
              </div>
            </div>
          </div>

          <div class="field-grid">

            <!-- Residential Assets Value -->
            <div class="field">
              <label for="residential_assets_value">Residential Assets Value (₹)</label>
              <input
                type="number"
                id="residential_assets_value"
                name="residential_assets_value"
                placeholder="e.g. 3000000"
                min="0"
                step="1000"
                aria-describedby="err_residential_assets_value"
              />
              <span class="error-msg" id="err_residential_assets_value" role="alert"></span>
            </div>

            <!-- Commercial Assets Value -->
            <div class="field">
              <label for="commercial_assets_value">Commercial Assets Value (₹)</label>
              <input
                type="number"
                id="commercial_assets_value"
                name="commercial_assets_value"
                placeholder="e.g. 0"
                min="0"
                step="1000"
                aria-describedby="err_commercial_assets_value"
              />
              <span class="error-msg" id="err_commercial_assets_value" role="alert"></span>
            </div>

            <!-- Luxury Assets Value -->
            <div class="field">
              <label for="luxury_assets_value">Luxury Assets Value (₹)</label>
              <input
                type="number"
                id="luxury_assets_value"
                name="luxury_assets_value"
                placeholder="e.g. 500000"
                min="0"
                step="1000"
                aria-describedby="err_luxury_assets_value"
              />
              <span class="error-msg" id="err_luxury_assets_value" role="alert"></span>
            </div>

            <!-- Bank Asset Value -->
            <div class="field">
              <label for="bank_asset_value">Bank Asset Value (₹)</label>
              <input
                type="number"
                id="bank_asset_value"
                name="bank_asset_value"
                placeholder="e.g. 250000"
                min="0"
                step="1000"
                aria-describedby="err_bank_asset_value"
              />
              <span class="error-msg" id="err_bank_asset_value" role="alert"></span>
            </div>

          </div>

          <button type="submit" class="predict-btn" id="predictBtn">
            <span class="btn-label">Predict Loan Status</span>
            <span class="btn-spinner" id="btnSpinner" hidden></span>
          </button>

        </form>

        <div class="trust-row">
          <span class="trust-item">🔒 256-bit encrypted</span>
          <span class="trust-item">⚡ Instant decision</span>
          <span class="trust-item">🗄️ Data never stored</span>
        </div>
      </section>

      <!-- ============ RESULT VIEW ============ -->
      <section class="card-body result-view" id="resultView" hidden>
        <div class="result-card" id="resultCard">
          <div class="result-icon" id="resultIcon" aria-hidden="true"></div>
          <h2 class="result-title" id="resultTitle"></h2>
          <p class="result-subtitle" id="resultSubtitle"></p>
        </div>
        <button type="button" class="secondary-btn" id="tryAgainBtn">Run another check</button>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
